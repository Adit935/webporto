<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portofolio - Creative Developer</title>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }



        :root {

            --primary: #6366f1;

            --secondary: #8b5cf6;

            --accent: #ec4899;

            --dark: #0f172a;

            --darker: #020617;

        }



        body {

            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

            background: var(--darker);

            color: #fff;

            overflow-x: hidden;

        }



        /* Cursor Effect */

        .cursor {

            width: 20px;

            height: 20px;

            border: 2px solid var(--primary);

            border-radius: 50%;

            position: fixed;

            pointer-events: none;

            z-index: 9999;

            transition: all 0.1s ease;

            mix-blend-mode: difference;

        }



        .cursor-follower {

            width: 40px;

            height: 40px;

            border: 1px solid var(--secondary);

            border-radius: 50%;

            position: fixed;

            pointer-events: none;

            z-index: 9998;

            transition: all 0.3s ease;

            opacity: 0.5;

        }



        /* Navigation */

        nav {

            position: fixed;

            width: 100%;

            padding: 1.5rem 0;

            z-index: 1000;

            transition: all 0.3s ease;

        }



        nav.scrolled {

            background: rgba(15, 23, 42, 0.8);

            backdrop-filter: blur(20px);

            border-bottom: 1px solid rgba(99, 102, 241, 0.2);

        }



        nav .container {

            max-width: 1400px;

            margin: 0 auto;

            padding: 0 3rem;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }



        nav .logo {

            font-size: 1.5rem;

            font-weight: 800;

            background: linear-gradient(135deg, var(--primary), var(--accent));

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            letter-spacing: -1px;

        }



        nav ul {

            list-style: none;

            display: flex;

            gap: 3rem;

        }



        nav a {

            text-decoration: none;

            color: rgba(255,255,255,0.7);

            font-weight: 600;

            font-size: 0.95rem;

            transition: all 0.3s ease;

            position: relative;

        }



        nav a::before {

            content: '';

            position: absolute;

            bottom: -5px;

            left: 0;

            width: 0;

            height: 2px;

            background: linear-gradient(90deg, var(--primary), var(--accent));

            transition: width 0.3s ease;

        }



        nav a:hover {

            color: #fff;

        }



        nav a:hover::before {

            width: 100%;

        }



        /* Hero Section */

        .hero {

            min-height: 100vh;

            display: flex;

            align-items: center;

            position: relative;

            overflow: hidden;

        }



        .gradient-bg {

            position: absolute;

            width: 100%;

            height: 100%;

            background: radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),

                        radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 50%),

                        radial-gradient(circle at 40% 90%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);

            animation: gradientShift 15s ease infinite;

        }



        @keyframes gradientShift {

            0%, 100% { opacity: 1; }

            50% { opacity: 0.8; }

        }



        .grid-bg {

            position: absolute;

            width: 100%;

            height: 100%;

            background-image: 

                linear-gradient(rgba(99, 102, 241, 0.1) 1px, transparent 1px),

                linear-gradient(90deg, rgba(99, 102, 241, 0.1) 1px, transparent 1px);

            background-size: 100px 100px;

            animation: gridMove 20s linear infinite;

            opacity: 0.5;

        }



        @keyframes gridMove {

            0% { transform: translate(0, 0); }

            100% { transform: translate(100px, 100px); }

        }



        .particles {

            position: absolute;

            width: 100%;

            height: 100%;

        }



        .particle {

            position: absolute;

            width: 4px;

            height: 4px;

            background: var(--primary);

            border-radius: 50%;

            animation: float 6s infinite;

            opacity: 0.6;

        }



        @keyframes float {

            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }

            50% { opacity: 0.8; }

            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }

        }



        .hero-content {

            position: relative;

            z-index: 1;

            max-width: 1400px;

            margin: 0 auto;

            padding: 0 3rem;

            width: 100%;

        }



        .hero-subtitle {

            font-size: 1.2rem;

            color: var(--primary);

            font-weight: 600;

            margin-bottom: 1rem;

            animation: fadeSlideUp 1s ease 0.2s both;

            text-transform: uppercase;

            letter-spacing: 3px;

        }



        .hero h1 {

            font-size: 6rem;

            font-weight: 900;

            line-height: 1.1;

            margin-bottom: 1.5rem;

            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.6) 100%);

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            animation: fadeSlideUp 1s ease 0.4s both;

            letter-spacing: -3px;

        }



        .hero p {

            font-size: 1.5rem;

            color: rgba(255,255,255,0.6);

            max-width: 600px;

            margin-bottom: 3rem;

            line-height: 1.6;

            animation: fadeSlideUp 1s ease 0.6s both;

        }



        @keyframes fadeSlideUp {

            from {

                opacity: 0;

                transform: translateY(50px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }



        .hero-buttons {

            display: flex;

            gap: 1.5rem;

            animation: fadeSlideUp 1s ease 0.8s both;

        }



        .btn {

            padding: 1.2rem 3rem;

            border-radius: 50px;

            text-decoration: none;

            font-weight: 700;

            font-size: 1rem;

            transition: all 0.3s ease;

            position: relative;

            overflow: hidden;

            display: inline-block;

        }



        .btn-primary {

            background: linear-gradient(135deg, var(--primary), var(--accent));

            color: white;

            box-shadow: 0 20px 60px rgba(99, 102, 241, 0.4);

        }



        .btn-primary::before {

            content: '';

            position: absolute;

            top: 0;

            left: -100%;

            width: 100%;

            height: 100%;

            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);

            transition: left 0.5s ease;

        }



        .btn-primary:hover::before {

            left: 100%;

        }



        .btn-primary:hover {

            transform: translateY(-3px);

            box-shadow: 0 30px 80px rgba(99, 102, 241, 0.5);

        }



        .btn-secondary {

            background: transparent;

            color: white;

            border: 2px solid rgba(255,255,255,0.3);

        }



        .btn-secondary:hover {

            border-color: var(--primary);

            background: rgba(99, 102, 241, 0.1);

            transform: translateY(-3px);

        }



        /* Floating Elements */

        .floating-shape {

            position: absolute;

            border-radius: 50%;

            filter: blur(80px);

            opacity: 0.6;

            animation: floatShape 20s infinite ease-in-out;

        }



        .shape1 {

            width: 400px;

            height: 400px;

            background: var(--primary);

            top: 10%;

            right: 10%;

            animation-delay: 0s;

        }



        .shape2 {

            width: 300px;

            height: 300px;

            background: var(--accent);

            bottom: 10%;

            left: 15%;

            animation-delay: 5s;

        }



        @keyframes floatShape {

            0%, 100% { transform: translate(0, 0) scale(1); }

            33% { transform: translate(50px, -50px) scale(1.1); }

            66% { transform: translate(-30px, 30px) scale(0.9); }

        }



        /* Sections */

        section {

            padding: 8rem 3rem;

            max-width: 1400px;

            margin: 0 auto;

            position: relative;

        }



        .section-title {

            font-size: 4rem;

            font-weight: 900;

            margin-bottom: 1rem;

            background: linear-gradient(135deg, #fff, rgba(255,255,255,0.5));

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            letter-spacing: -2px;

        }



        .section-subtitle {

            color: rgba(255,255,255,0.5);

            font-size: 1.2rem;

            margin-bottom: 4rem;

        }



        /* About Section */

        .about-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 5rem;

            align-items: center;

        }



        .about-image {

            position: relative;

            height: 500px;

            border-radius: 30px;

            overflow: hidden;

            background: linear-gradient(135deg, var(--primary), var(--accent));

        }



        .profile-pic-container {

            width: 100%;

            height: 100%;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

        }



        .profile-pic {

            width: 350px;

            height: 350px;

            border-radius: 50%;

            object-fit: cover;

            border: 5px solid rgba(255, 255, 255, 0.2);

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);

            position: relative;

            z-index: 2;

            transition: all 0.4s ease;

        }



        .profile-pic:hover {

            transform: scale(1.05) rotate(5deg);

            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);

        }



        .profile-pic-placeholder {

            width: 350px;

            height: 350px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.1);

            border: 5px solid rgba(255, 255, 255, 0.2);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 8rem;

            backdrop-filter: blur(10px);

            position: relative;

            z-index: 2;

        }



        .about-image::before {

            content: '';

            position: absolute;

            inset: 0;

            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);

            animation: shimmer 3s infinite;

            z-index: 1;

        }



        .about-image::after {

            content: '';

            position: absolute;

            width: 400px;

            height: 400px;

            border-radius: 50%;

            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            z-index: 1;

        }



        @keyframes shimmer {

            0% { transform: translateX(-100%) translateY(-100%); }

            100% { transform: translateX(100%) translateY(100%); }

        }



        .about-text p {

            color: rgba(255,255,255,0.7);

            font-size: 1.1rem;

            line-height: 1.8;

            margin-bottom: 1.5rem;

        }



        .stats-grid {

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 2rem;

            margin-top: 3rem;

        }



        .stat-card {

            background: rgba(99, 102, 241, 0.1);

            border: 1px solid rgba(99, 102, 241, 0.2);

            border-radius: 20px;

            padding: 2rem;

            text-align: center;

            transition: all 0.3s ease;

        }



        .stat-card:hover {

            transform: translateY(-10px);

            background: rgba(99, 102, 241, 0.15);

            border-color: var(--primary);

        }



        .stat-number {

            font-size: 3rem;

            font-weight: 900;

            background: linear-gradient(135deg, var(--primary), var(--accent));

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            margin-bottom: 0.5rem;

        }



        .stat-label {

            color: rgba(255,255,255,0.6);

            font-size: 0.95rem;

            text-transform: uppercase;

            letter-spacing: 1px;

        }



        /* Education Section */

        .education-container {

            margin-top: 3rem;

            display: flex;

            flex-direction: column;

            gap: 2rem;

        }



        .education-card {

            background: rgba(15, 23, 42, 0.5);

            border: 1px solid rgba(99, 102, 241, 0.2);

            border-radius: 25px;

            padding: 2.5rem;

            position: relative;

            overflow: hidden;

            transition: all 0.4s ease;

            display: flex;

            gap: 2rem;

        }



        .education-card::before {

            content: '';

            position: absolute;

            top: 0;

            left: 0;

            width: 5px;

            height: 100%;

            background: linear-gradient(135deg, var(--primary), var(--accent));

        }



        .education-card:hover {

            transform: translateY(-10px);

            border-color: var(--primary);

            box-shadow: 0 30px 60px rgba(99, 102, 241, 0.3);

        }



        .education-year {

            min-width: 100px;

            height: 100px;

            background: linear-gradient(135deg, var(--primary), var(--accent));

            border-radius: 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 1.2rem;

            font-weight: 700;

            color: white;

            flex-direction: column;

        }



        .education-year span {

            font-size: 0.8rem;

            opacity: 0.8;

        }



        .education-content {

            flex: 1;

        }



        .education-school {

            font-size: 1.8rem;

            font-weight: 800;

            margin-bottom: 0.5rem;

        }



        .education-degree {

            font-size: 1.2rem;

            color: var(--primary);

            margin-bottom: 1rem;

        }



        .education-description {

            color: rgba(255,255,255,0.6);

            line-height: 1.6;

        }



        /* Experience Section */

        .experience-container {

            margin-top: 3rem;

            display: flex;

            flex-direction: column;

            gap: 2rem;

        }



        .experience-card {

            background: rgba(15, 23, 42, 0.5);

            border: 1px solid rgba(99, 102, 241, 0.2);

            border-radius: 25px;

            padding: 2.5rem;

            position: relative;

            overflow: hidden;

            transition: all 0.4s ease;

            display: flex;

            gap: 2rem;

        }



        .experience-card::before {

            content: '';

            position: absolute;

            top: 0;

            left: 0;

            width: 5px;

            height: 100%;

            background: linear-gradient(135deg, var(--secondary), var(--accent));

        }



        .experience-card:hover {

            transform: translateY(-10px);

            border-color: var(--secondary);

            box-shadow: 0 30px 60px rgba(139, 92, 246, 0.3);

        }



        .experience-date {

            min-width: 120px;

            height: 100px;

            background: linear-gradient(135deg, var(--secondary), var(--accent));

            border-radius: 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 1.1rem;

            font-weight: 700;

            color: white;

            flex-direction: column;

        }



        .experience-date span {

            font-size: 0.8rem;

            opacity: 0.8;

        }



        .experience-content {

            flex: 1;

        }



        .experience-position {

            font-size: 1.8rem;

            font-weight: 800;

            margin-bottom: 0.5rem;

        }



        .experience-company {

            font-size: 1.2rem;

            color: var(--secondary);

            margin-bottom: 1rem;

        }



        .experience-description {

            color: rgba(255,255,255,0.6);

            line-height: 1.6;

            margin-bottom: 1rem;

        }



        .experience-skills {

            display: flex;

            flex-wrap: wrap;

            gap: 0.8rem;

        }



        .experience-skill {

            background: rgba(139, 92, 246, 0.2);

            color: var(--secondary);

            padding: 0.5rem 1.2rem;

            border-radius: 20px;

            font-size: 0.85rem;

            font-weight: 600;

            border: 1px solid rgba(139, 92, 246, 0.3);

        }



        /* Skills Section */

        .skills-container {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

            gap: 2rem;

            margin-top: 3rem;

        }



        .skill-card {

            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.1));

            border: 1px solid rgba(99, 102, 241, 0.2);

            border-radius: 25px;

            padding: 2.5rem;

            position: relative;

            overflow: hidden;

            transition: all 0.4s ease;

        }



        .skill-card::before {

            content: '';

            position: absolute;

            top: -50%;

            left: -50%;

            width: 200%;

            height: 200%;

            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);

            transform: rotate(45deg);

            transition: all 0.5s ease;

        }



        .skill-card:hover::before {

            transform: rotate(45deg) translate(50%, 50%);

        }



        .skill-card:hover {

            transform: translateY(-10px) scale(1.02);

            border-color: var(--primary);

            box-shadow: 0 30px 60px rgba(99, 102, 241, 0.3);

        }



        .skill-icon {

            font-size: 3rem;

            margin-bottom: 1.5rem;

            display: block;

        }



        .skill-name {

            font-size: 1.5rem;

            font-weight: 700;

            margin-bottom: 1rem;

        }



        .skill-description {

            color: rgba(255,255,255,0.6);

            line-height: 1.6;

        }



        /* Projects Section */

        .projects-grid {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));

            gap: 3rem;

            margin-top: 3rem;

        }



        .project-card {

            background: rgba(15, 23, 42, 0.5);

            border: 1px solid rgba(99, 102, 241, 0.2);

            border-radius: 25px;

            overflow: hidden;

            transition: all 0.4s ease;

            position: relative;

            cursor: pointer;

        }



        .project-card::after {

            content: '';

            position: absolute;

            inset: 0;

            background: linear-gradient(135deg, var(--primary), var(--accent));

            opacity: 0;

            transition: opacity 0.4s ease;

        }



        .project-card:hover::after {

            opacity: 0.1;

        }



        .project-card:hover {

            transform: translateY(-15px);

            border-color: var(--primary);

            box-shadow: 0 40px 80px rgba(99, 102, 241, 0.3);

        }



        .project-image {

            height: 250px;

            background: linear-gradient(135deg, var(--primary), var(--accent));

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 5rem;

            position: relative;

            overflow: hidden;

        }



        .project-image::before {

            content: '';

            position: absolute;

            inset: 0;

            background: rgba(0,0,0,0.3);

            opacity: 0;

            transition: opacity 0.4s ease;

        }



        .project-card:hover .project-image::before {

            opacity: 1;

        }



        .project-content {

            padding: 2.5rem;

            position: relative;

            z-index: 1;

        }



        .project-number {

            font-size: 0.9rem;

            color: var(--primary);

            font-weight: 700;

            margin-bottom: 0.5rem;

            text-transform: uppercase;

            letter-spacing: 2px;

        }



        .project-title {

            font-size: 1.8rem;

            font-weight: 800;

            margin-bottom: 1rem;

        }



        .project-description {

            color: rgba(255,255,255,0.6);

            line-height: 1.6;

            margin-bottom: 1.5rem;

        }



        .project-tags {

            display: flex;

            flex-wrap: wrap;

            gap: 0.8rem;

        }



        .tag {

            background: rgba(99, 102, 241, 0.2);

            color: var(--primary);

            padding: 0.5rem 1.2rem;

            border-radius: 20px;

            font-size: 0.85rem;

            font-weight: 600;

            border: 1px solid rgba(99, 102, 241, 0.3);

        }



        /* Contact Section - Enhanced & Centered */

        #contact {

            padding: 8rem 3rem;

            background: linear-gradient(135deg, rgba(99, 102, 241, 0.05), rgba(236, 72, 153, 0.05));

            position: relative;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

        }



        #contact::before {

            content: '';

            position: absolute;

            top: -50%;

            right: -50%;

            width: 200%;

            height: 200%;

            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);

            animation: rotate 30s linear infinite;

        }



        @keyframes rotate {

            0% { transform: rotate(0deg); }

            100% { transform: rotate(360deg); }

        }



        .contact-wrapper {

            max-width: 800px;

            width: 100%;

            margin: 0 auto;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 3rem;

            position: relative;

            z-index: 1;

        }



        .contact-header {

            text-align: center;

            margin-bottom: 1rem;

        }



        .contact-header h2 {

            font-size: 3rem;

            font-weight: 900;

            background: linear-gradient(135deg, #fff, rgba(255,255,255,0.5));

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            margin-bottom: 1rem;

        }



        .contact-header p {

            color: rgba(255,255,255,0.6);

            font-size: 1.2rem;

            line-height: 1.6;

            max-width: 600px;

            margin: 0 auto;

        }



        .contact-info {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

            gap: 2rem;

            width: 100%;

        }



        .info-card {

            background: rgba(15, 23, 42, 0.6);

            border: 1px solid rgba(99, 102, 241, 0.2);

            border-radius: 20px;

            padding: 2rem;

            transition: all 0.3s ease;

            position: relative;

            overflow: hidden;

            text-align: center;

        }



        .info-card::before {

            content: '';

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 3px;

            background: linear-gradient(90deg, var(--primary), var(--accent));

            transform: scaleX(0);

            transition: transform 0.3s ease;

        }



        .info-card:hover::before {

            transform: scaleX(1);

        }



        .info-card:hover {

            transform: translateY(-5px);

            border-color: var(--primary);

            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.2);

        }



        .info-card-icon {

            width: 60px;

            height: 60px;

            background: linear-gradient(135deg, var(--primary), var(--accent));

            border-radius: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 1.5rem;

            margin: 0 auto 1.5rem;

        }



        .info-card h3 {

            font-size: 1.3rem;

            font-weight: 700;

            margin-bottom: 0.5rem;

            color: #fff;

        }



        .info-card p {

            color: rgba(255,255,255,0.6);

            line-height: 1.6;

        }



        .info-card a {

            color: var(--primary);

            text-decoration: none;

            transition: color 0.3s ease;

        }



        .info-card a:hover {

            color: var(--accent);

        }



        .map-container {

            background: rgba(15, 23, 42, 0.6);

            border: 1px solid rgba(99, 102, 241, 0.2);

            border-radius: 20px;

            overflow: hidden;

            height: 300px;

            position: relative;

            width: 100%;

            margin-top: 2rem;

        }



        .map-container iframe {

            width: 100%;

            height: 100%;

            border: none;

        }



        .contact-form-container {

            background: rgba(15, 23, 42, 0.6);

            border: 1px solid rgba(99, 102, 241, 0.2);

            border-radius: 25px;

            padding: 3rem;

            position: relative;

            overflow: hidden;

            width: 100%;

        }



        .contact-form-container::before {

            content: '';

            position: absolute;

            top: -50%;

            right: -50%;

            width: 200%;

            height: 200%;

            background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, transparent 70%);

            animation: rotate 20s linear infinite reverse;

        }



        .contact-form {

            position: relative;

            z-index: 1;

        }



        .form-group {

            margin-bottom: 1.5rem;

        }



        .form-group label {

            display: block;

            color: rgba(255,255,255,0.8);

            font-weight: 600;

            font-size: 0.95rem;

            margin-bottom: 0.5rem;

            text-transform: uppercase;

            letter-spacing: 1px;

        }



        .form-group input,

        .form-group textarea {

            width: 100%;

            background: rgba(255,255,255,0.05);

            border: 2px solid rgba(99, 102, 241, 0.2);

            border-radius: 15px;

            padding: 1rem 1.5rem;

            color: white;

            font-size: 1rem;

            font-family: inherit;

            transition: all 0.3s ease;

        }



        .form-group input:focus,

        .form-group textarea:focus {

            outline: none;

            border-color: var(--primary);

            background: rgba(99, 102, 241, 0.05);

            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);

        }



        .form-group textarea {

            min-height: 150px;

            resize: vertical;

        }



        .submit-btn {

            width: 100%;

            background: linear-gradient(135deg, var(--primary), var(--accent));

            color: white;

            border: none;

            padding: 1.2rem 2rem;

            border-radius: 15px;

            font-size: 1.1rem;

            font-weight: 700;

            cursor: pointer;

            transition: all 0.3s ease;

            position: relative;

            overflow: hidden;

        }



        .submit-btn::before {

            content: '';

            position: absolute;

            top: 50%;

            left: 50%;

            width: 0;

            height: 0;

            background: rgba(255,255,255,0.3);

            border-radius: 50%;

            transform: translate(-50%, -50%);

            transition: width 0.5s ease, height 0.5s ease;

        }



        .submit-btn:hover::before {

            width: 300px;

            height: 300px;

        }



        .submit-btn:hover {

            transform: translateY(-3px);

            box-shadow: 0 20px 60px rgba(99, 102, 241, 0.4);

        }



        .social-section {

            margin-top: 3rem;

            text-align: center;

            width: 100%;

        }



        .social-section h3 {

            font-size: 1.5rem;

            font-weight: 700;

            margin-bottom: 1.5rem;

            color: rgba(255,255,255,0.8);

        }



        .social-links {

            display: flex;

            justify-content: center;

            gap: 1.5rem;

        }



        .social-link {

            width: 60px;

            height: 60px;

            border-radius: 50%;

            background: rgba(99, 102, 241, 0.1);

            border: 2px solid rgba(99, 102, 241, 0.3);

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            text-decoration: none;

            font-size: 1.5rem;

            transition: all 0.3s ease;

            position: relative;

            overflow: hidden;

        }



        .social-link::before {

            content: '';

            position: absolute;

            top: 50%;

            left: 50%;

            width: 0;

            height: 0;

            background: linear-gradient(135deg, var(--primary), var(--accent));

            border-radius: 50%;

            transform: translate(-50%, -50%);

            transition: width 0.3s ease, height 0.3s ease;

            z-index: -1;

        }



        .social-link:hover::before {

            width: 100%;

            height: 100%;

        }



        .social-link:hover {

            border-color: transparent;

            transform: translateY(-5px) rotate(360deg);

            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);

        }



        /* Footer */

        footer {

            background: rgba(0,0,0,0.3);

            border-top: 1px solid rgba(99, 102, 241, 0.2);

            padding: 3rem 2rem;

            text-align: center;

            color: rgba(255,255,255,0.5);

        }



        /* Scroll Animations */

        .reveal {

            opacity: 0;

            transform: translateY(50px);

            transition: all 0.8s ease;

        }



        .reveal.active {

            opacity: 1;

            transform: translateY(0);

        }

                grid-template-columns: 1fr;

            }

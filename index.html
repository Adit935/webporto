<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio - Aditia</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #6366f1;
    --accent: #ec4899;
    --dark: #0f172a;
}

body {
    font-family: Arial, sans-serif;
    background: var(--dark);
    color: white;
}

/* NAVBAR */
nav {
    position: fixed;
    width: 100%;
    padding: 20px;
    background: rgba(0,0,0,0.5);
}

nav .container {
    display: flex;
    justify-content: space-between;
}

nav ul {
    display: flex;
    gap: 20px;
    list-style: none;
}

nav a {
    color: white;
    text-decoration: none;
}

/* HERO */
.hero {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.hero-content {
    text-align: center;
}

.hero h1 {
    font-size: 60px;
}

.hero p {
    margin: 20px 0;
}

/* BUTTON */
.btn {
    padding: 12px 25px;
    border-radius: 30px;
    text-decoration: none;
    margin: 5px;
    display: inline-block;
}

.btn-primary {
    background: linear-gradient(45deg, var(--primary), var(--accent));
    color: white;
}

/* BACKGROUND */
.gradient-bg {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(99,102,241,0.2), transparent);
    z-index: -1;
}

/* SECTION */
section {
    padding: 80px 20px;
    text-align: center;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .hero h1 {
        font-size: 35px;
    }

    nav ul {
        display: none;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <div class="container">
        <div><b>Aditia</b></div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#project">Project</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <div class="gradient-bg"></div>

    <div class="hero-content">
        <h1>Halo, Saya Aditia</h1>
        <p>Creative Developer</p>

        <a href="#" class="btn btn-primary">Lihat Project</a>
    </div>
</section>

<!-- ABOUT -->
<section id="about">
    <h2>About Me</h2>
    <p>Saya adalah developer yang fokus membuat website modern dan interaktif.</p>
</section>

<!-- PROJECT -->
<section id="project">
    <h2>Project</h2>
    <p>Beberapa project akan ditampilkan di sini.</p>
</section>

<!-- CONTACT -->
<section id="contact">
    <h2>Contact</h2>
    <p>Email: aditia@email.com</p>
</section>

<!-- JS -->
<script>
// efek navbar scroll
window.addEventListener("scroll", function() {
    const nav = document.querySelector("nav");
    if (window.scrollY > 50) {
        nav.style.background = "rgba(0,0,0,0.8)";
    } else {
        nav.style.background = "rgba(0,0,0,0.5)";
    }
});
</script>

</body>
</html>
